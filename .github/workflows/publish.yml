name: Publish Gardi Motors website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gardi-motors-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract website files from existing archive
        shell: bash
        run: |
          if [ ! -f index.html ]; then
            python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('gardi-motors-github-source-NEW.zip')
          with zipfile.ZipFile(src) as z:
              for item in z.infolist():
                  p=Path(item.filename)
                  if p.parts[:1] != ('gardi-elite-drive',) or len(p.parts) < 2:
                      continue
                  dest=Path(*p.parts[1:])
                  if item.is_dir():
                      dest.mkdir(parents=True,exist_ok=True)
                  else:
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(z.read(item))
          PY
            python3 - <<'PY'
          from pathlib import Path
          c=Path('js/config.js');s=c.read_text();s=s.replace("whatsapp: '',","whatsapp: '233244253966',").replace("telephone: '',","telephone: '0244253966',");c.write_text(s)
          p=Path('js/components/contact.js');s=p.read_text()
          needle='        <div class="form-field full"><label for="contact-message">'
          s=s.replace(needle,'        <div class="form-field"><label for="inspection-date">Preferred inspection date *</label><input id="inspection-date" name="inspectionDate" type="date" required /></div>\n        <div class="form-field"><label for="inspection-time">Preferred inspection time *</label><input id="inspection-time" name="inspectionTime" type="time" required /></div>\n'+needle)
          s=s.replace('Send a vehicle enquiry','Request a vehicle inspection')
          s=s.replace('I would like to enquire about the','I would like to inspect the')
          s=s.replace("const subject = `Gardi Motors enquiry","const subject = `Gardi Motors vehicle inspection request")
          # Add appointment fields to the WhatsApp message without removing other information.
          s=s.replace("      `Please contact me with more information.`,","      `Preferred inspection date: ${data.get('inspectionDate') || 'Not specified'}`,\n      `Preferred inspection time: ${data.get('inspectionTime') || 'Not specified'}`,\n      `Please contact me to confirm inspection availability and location.`,")
          p.write_text(s)
          p=Path('js/components/inventory.js');s=p.read_text().replace('>Enquire ↗</button>','>Inspect ↗</button>');p.write_text(s)
          p=Path('js/components/modal.js');s=p.read_text().replace('Enquire about this car ↗','Request a car inspection ↗');p.write_text(s)
          p=Path('index.html');s=p.read_text().replace('Select a vehicle and choose “Enquire”','Select a vehicle and choose “Inspect”');p.write_text(s)
          PY
            touch .nojekyll
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html css js assets .nojekyll README.md .gitignore
            git commit -m "Extract showroom into deployable static website"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
